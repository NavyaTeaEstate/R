<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell – My Personal Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
:root{--pri:#92400E;--pri2:#A16207;--acc:#6366F1;--bg:#FFFBEB;--fg:#0F172A;--card:#fff;--mut:#F8F3F0;--mf:#475569;--bd:#F1E8E2;--ok:#15803D;--bad:#DC2626;--r:20px;--sh:0 10px 30px -12px rgba(146,64,14,.25);--hf:'Fraunces',Georgia,serif;--bf:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--bf);color:var(--fg);background:linear-gradient(135deg,#FFFBEB,#FEF3C7 60%,#FDE9D2);min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:-1;animation:float 14s ease-in-out infinite}
.b1{width:420px;height:420px;background:#FCD34D;top:-120px;left:-100px}
.b2{width:380px;height:380px;background:#A5B4FC;bottom:-120px;right:-80px;animation-delay:-6s}
.b3{width:300px;height:300px;background:#FDBA74;top:45%;left:50%;animation-delay:-3s}
@keyframes float{50%{transform:translate(40px,-50px) scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:rotate(-16deg)}40%,80%{transform:rotate(16deg)}}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);animation:rise .6s both}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:.7rem 1.3rem;border-radius:12px;font-weight:600;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px -6px var(--pri)}
.btn.ghost{background:var(--mut);color:var(--pri);border:1px solid var(--bd)}
.btn.danger{background:#fee2e2;color:var(--bad)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:1rem}
#auth .card{width:min(440px,100%);padding:2.4rem}
.logo{display:flex;align-items:center;gap:.7rem;font-family:var(--hf);font-size:2rem;color:var(--pri);margin-bottom:.3rem}
.sub{color:var(--mf);margin-bottom:1.4rem}
.tabs{display:flex;background:var(--mut);border-radius:12px;padding:4px;margin-bottom:1.2rem}
.tabs button{flex:1;padding:.55rem;border-radius:9px;font-weight:600;color:var(--mf);transition:.25s}
.tabs .on{background:#fff;color:var(--pri);box-shadow:0 2px 8px rgba(0,0,0,.08)}
label{display:block;font-size:.85rem;font-weight:600;margin:.8rem 0 .3rem}
input[type=text],input[type=password],input[type=email]{width:100%;padding:.75rem 1rem;border:1.5px solid var(--bd);border-radius:12px;font:inherit;background:#fff;transition:.2s}
input:focus{border-color:var(--pri);outline:0;box-shadow:0 0 0 4px rgba(146,64,14,.12)}
#af .btn{width:100%;margin-top:1.3rem}
#msg{color:var(--bad);min-height:1.3rem;margin-top:.7rem;font-size:.9rem}
.note{font-size:.75rem;color:var(--mf);margin-top:1rem;text-align:center}
/* app */
#app{padding:1rem 1.5rem 2rem;max-width:1700px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;padding:.6rem 0 1rem;animation:rise .5s both}
header .r{display:flex;gap:.8rem;align-items:center}
.who{color:var(--mf);font-weight:500}
#bell{position:relative;width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--bd);display:grid;place-items:center;box-shadow:var(--sh)}
#bell.ring svg{animation:shake .8s}
#bc{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:.7rem;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;animation:pulse 2s infinite}
main{display:grid;grid-template-columns:minmax(340px,480px) 1fr;gap:1.4rem;align-items:start}
.side{display:grid;gap:1.4rem}
.calc{padding:1.3rem}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
#mt{font-family:var(--hf);font-size:1.45rem;color:var(--pri)}
.nav{display:flex;gap:.4rem}
.nav button{width:36px;height:36px;border-radius:10px;background:var(--mut);transition:.2s;font-weight:700}
.nav button:hover{background:var(--pri);color:#fff}
.nav .td{width:auto;padding:0 .8rem;font-size:.8rem}
.wd,#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd span{text-align:center;font-size:.72rem;font-weight:600;color:var(--mf);text-transform:uppercase;padding-bottom:.3rem}
.day{position:relative;aspect-ratio:1;border-radius:14px;background:var(--mut);font-weight:600;animation:pop .4s both;animation-delay:calc(var(--i)*14ms);transition:transform .2s,background .2s}
.day:hover:not(:disabled){transform:translateY(-3px) scale(1.06);background:#FDE68A}
.day:disabled{opacity:.35;cursor:default}
.day.today{border:2px solid var(--pri)}
.day.sel{background:var(--pri);color:#fff}
.day.has::after,.day.miss::after{position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;font-size:.65rem;display:grid;place-items:center;color:#fff;font-weight:700}
.day.has::after{content:'✓';background:var(--ok)}
.day.miss::after{content:'!';background:var(--bad)}
.day.miss{background:#FEE2E2}
.leg{display:flex;gap:1rem;margin-top:1rem;font-size:.78rem;color:var(--mf);flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.alc{padding:1.2rem}
.alc h3{font-family:var(--hf);color:var(--bad);margin-bottom:.6rem}
#al{list-style:none;padding:0;display:grid;gap:.4rem;max-height:240px;overflow:auto}
#al li{display:flex;justify-content:space-between;align-items:center;background:#FEF2F2;border-radius:10px;padding:.5rem .8rem;font-size:.9rem;animation:rise .4s both}
#al li button{background:var(--bad);color:#fff;border-radius:8px;padding:.25rem .7rem;font-size:.8rem}
#al .ok{background:#DCFCE7;color:var(--ok);font-weight:600}
#al .more{background:none;color:var(--mf)}
.alc.flash{animation:pulse 1s 2}
/* editor */
.ed{padding:1.3rem;min-height:calc(100vh - 140px);display:flex;flex-direction:column}
#empty{margin:auto;text-align:center;color:var(--mf);font-family:var(--hf);font-size:1.4rem}
#editor{display:none;flex-direction:column;flex:1}
#editor.on{display:flex;animation:rise .45s both}
#dt{font-family:var(--hf);font-size:1.7rem;color:var(--pri);margin-bottom:.8rem}
#tb{display:flex;flex-wrap:wrap;gap:.35rem;padding:.6rem;background:var(--mut);border-radius:14px;border:1px solid var(--bd);position:sticky;top:.5rem;z-index:5}
#tb button,#tb select,#tb .col{height:34px;min-width:34px;border-radius:9px;background:#fff;border:1px solid var(--bd);padding:0 .5rem;font-size:.85rem;transition:.15s}
#tb button:hover,#tb .col:hover{background:var(--pri);color:#fff}
#tb .sep{width:1px;background:var(--bd);margin:0 .2rem}
#tb .col{display:inline-flex;align-items:center;gap:.3rem;cursor:pointer;position:relative}
#tb input[type=color]{width:20px;height:20px;border:0;padding:0;background:none;cursor:pointer}
#ed{flex:1;min-height:360px;margin-top:.8rem;padding:1.4rem 1.6rem;background:#FFFDF6 repeating-linear-gradient(transparent 0 33px,#F3E8D0 33px 34px);background-origin:padding-box;border-radius:14px;border:1px solid var(--bd);line-height:34px;font-size:1.05rem;outline:0;overflow:auto;transition:box-shadow .2s}
#ed:focus{box-shadow:0 0 0 4px rgba(146,64,14,.1)}
#ed:empty::before{content:'Dear diary, today I…';color:#b8a894}
#ed img{max-width:100%;border-radius:12px;margin:.5rem 0;box-shadow:0 6px 16px rgba(0,0,0,.12);line-height:0}
#ed h1,#ed h2,#ed h3{font-family:var(--hf);line-height:1.3;color:var(--pri)}
#ed blockquote{border-left:4px solid var(--pri2);padding-left:1rem;color:var(--mf)}
.ef{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:.8rem;flex-wrap:wrap}
.ef .g{display:flex;gap:.6rem}
#wc{color:var(--mf);font-size:.85rem}
/* modal */
#pm{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:50;padding:1rem;backdrop-filter:blur(4px)}
#pm .card{padding:1.2rem;width:min(860px,100%)}
#pm .tools{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
#cv{width:100%;aspect-ratio:2/1;border-radius:14px;border:2px dashed var(--bd);touch-action:none;cursor:crosshair;background:#fffdf6}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:var(--fg);color:#fff;padding:.8rem 1.4rem;border-radius:14px;transition:transform .4s cubic-bezier(.2,1.4,.4,1);z-index:99}
#toast.on{transform:translate(-50%,0)}
@media(max-width:980px){main{grid-template-columns:1fr}.ed{min-height:auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<section id="auth">
 <div class="card">
  <div class="logo"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h12a3 3 0 013 3v13H7a3 3 0 01-3-3V4z"/><path d="M8 8h7M8 12h5"/></svg>Inkwell</div>
  <p class="sub">Your private space to write, reflect and remember.</p>
  <div class="tabs"><button class="on" data-m="login" type="button">Login</button><button data-m="register" type="button">Create account</button></div>
  <form id="af">
   <div id="un-wrap" hidden>
     <label for="un">Username</label>
     <input id="un" type="text" autocomplete="username" minlength="3" placeholder="e.g. alice">
   </div>
   <label for="em">Email</label>
   <input id="em" type="email" autocomplete="email" required placeholder="you@example.com">
   <label for="p">Password</label>
   <input id="p" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters">
   <button class="btn" id="sb">Login</button>
   <div id="msg" role="alert"></div>
  </form>
  <p class="note">Data is stored securely in your private Supabase account. Only you can read your entries.</p>
 </div>
</section>

<div id="app" hidden>
 <header>
  <div class="logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h12a3 3 0 013 3v13H7a3 3 0 01-3-3V4z"/><path d="M8 8h7M8 12h5"/></svg>Inkwell</div>
  <div class="r"><span class="who" id="who"></span>
   <button id="bell" aria-label="Missed days alerts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg><span id="bc" hidden>0</span></button>
   <button class="btn ghost" id="lo">Logout</button></div>
 </header>
 <main>
  <div class="side">
   <div class="card calc">
    <div class="ch"><h2 id="mt"></h2><div class="nav"><button id="pv" aria-label="Previous month">‹</button><button class="td" id="tdy">Today</button><button id="nx" aria-label="Next month">›</button></div></div>
    <div class="wd"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
    <div id="grid"></div>
    <div class="leg"><span><i style="background:var(--ok)"></i>Written</span><span><i style="background:var(--bad)"></i>Missed</span><span><i style="background:var(--pri)"></i>Selected</span></div>
   </div>
   <div class="card alc" id="alc"><h3>Missed days</h3><ul id="al"></ul></div>
  </div>
  <div class="card ed">
   <div id="empty">Pick a date to start writing ✍️</div>
   <div id="editor">
    <h2 id="dt"></h2>
    <div id="tb">
     <select data-c="formatBlock" aria-label="Style"><option value="<p>">Normal</option><option value="<h1>">Heading 1</option><option value="<h2>">Heading 2</option><option value="<h3>">Heading 3</option><option value="<blockquote>">Quote</option></select>
     <select data-c="fontName" aria-label="Font"><option>Inter</option><option>Georgia</option><option>Fraunces</option><option>Courier New</option><option>Comic Sans MS</option><option>Brush Script MT</option></select>
     <select data-c="fontSize" aria-label="Size"><option value="2">Small</option><option value="3" selected>Medium</option><option value="5">Large</option><option value="6">X-Large</option></select>
     <span class="sep"></span>
     <button data-c="bold" title="Bold"><b>B</b></button><button data-c="italic" title="Italic"><i>I</i></button><button data-c="underline" title="Underline"><u>U</u></button><button data-c="strikeThrough" title="Strike"><s>S</s></button>
     <label class="col" title="Text color">A<input type="color" data-c="foreColor" value="#92400E"></label>
     <label class="col" title="Highlight">▮<input type="color" data-c="hiliteColor" value="#FDE68A"></label>
     <span class="sep"></span>
     <button data-c="insertUnorderedList" title="Bullets">• ≡</button><button data-c="insertOrderedList" title="Numbers">1. ≡</button>
     <button data-c="justifyLeft" title="Left">⇤</button><button data-c="justifyCenter" title="Center">↔</button><button data-c="justifyRight" title="Right">⇥</button><button data-c="justifyFull" title="Justify">☰</button>
     <button data-c="undo" title="Undo">↶</button><button data-c="redo" title="Redo">↷</button><button data-c="removeFormat" title="Clear formatting">Tx</button>
     <span class="sep"></span>
     <button id="ib" title="Add picture">🖼 Picture</button><button id="pb" title="Pen drawing">✏️ Pen</button>
     <input type="file" id="img" accept="image/*" multiple hidden>
    </div>
    <div id="ed" contenteditable="true" spellcheck="true"></div>
    <div class="ef"><span id="wc">0 words</span><div class="g"><button class="btn danger" id="del">Delete</button><button class="btn" id="sv">Save entry</button></div></div>
   </div>
  </div>
 </main>
</div>

<div id="pm" hidden>
 <div class="card">
  <div class="tools">
   <label style="margin:0">Color <input type="color" id="pc" value="#1f2937"></label>
   <label style="margin:0">Size <input type="range" id="ps" min="1" max="20" value="3"></label>
   <button class="btn ghost" id="pe">Eraser</button><button class="btn ghost" id="pcl">Clear</button>
   <span style="flex:1"></span><button class="btn ghost" id="pcx">Cancel</button><button class="btn" id="pin">Insert drawing</button>
  </div>
  <canvas id="cv" width="1200" height="600"></canvas>
 </div>
</div>
<div id="toast" role="status"></div>

<script>
/* ── Supabase client ─────────────────────────────────────── */
const SUPABASE_URL = 'https://ewrfjagecrzslpwrwcxh.supabase.co';
// Browser code may contain only a Supabase publishable/anon key. NEVER put a
// service_role key or a secret key in this file. Database security comes from RLS.
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhbGciOiJIUzI1NiIsInJlZiI6ImV3cmZqYWdlY3J6c2xwd3J3Y3hoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDg1NTIsImV4cCI6MjEwODA4NDU1Mn0.Y6BdaBkbaFvl05BzNPqKvDTwFq_-oEUIejKEIez5Pqs';
if (!window.supabase || !window.DOMPurify) {
  document.body.textContent = 'Security libraries could not load. Check your internet connection and reload.';
  throw new Error('Required security libraries failed to load');
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

// Strictly sanitize diary HTML before it is stored or rendered. Only formatting
// elements and locally embedded raster images are allowed. Active content and
// external image URLs are removed. RLS is still required on the Supabase database.
const DIARY_TAGS = ['p','br','div','span','b','strong','i','em','u','s','strike',
  'h1','h2','h3','blockquote','ul','ol','li','img'];
const DIARY_ATTRS = ['style','src','alt','title'];
const SAFE_STYLE_PROPS = new Set(['color','background-color','font-family','font-size',
  'font-weight','font-style','text-decoration','text-align']);
function sanitizeDiaryHtml(dirtyHtml) {
  const clean = DOMPurify.sanitize(String(dirtyHtml || ''), {
    ALLOWED_TAGS: DIARY_TAGS,
    ALLOWED_ATTR: DIARY_ATTRS,
    ALLOW_DATA_ATTR: false,
    FORBID_TAGS: ['script','style','iframe','object','embed','form','input','svg','math'],
    FORBID_ATTR: ['srcset','formaction','onerror','onload']
  });
  const box = document.createElement('div');
  box.innerHTML = clean;
  box.querySelectorAll('*').forEach(el => {
    if (el.hasAttribute('style')) {
      const declarations = [];
      for (const part of el.getAttribute('style').split(';')) {
        const colon = part.indexOf(':');
        if (colon < 1) continue;
        const prop = part.slice(0, colon).trim().toLowerCase();
        const value = part.slice(colon + 1).trim();
        if (!SAFE_STYLE_PROPS.has(prop) || !value || /url\s*\(|expression|@import|javascript:|var\s*\(/i.test(value)) continue;
        let valid = false;
        if (prop === 'color' || prop === 'background-color') valid = /^(#[0-9a-f]{3,8}|rgba?\([0-9.,%\s]+\)|hsla?\([0-9.,%\s]+\)|[a-z]{1,20})$/i.test(value);
        else if (prop === 'font-size') valid = /^(\d+(\.\d+)?(px|pt|em|rem|%)|xx-small|x-small|small|medium|large|x-large|xx-large)$/i.test(value);
        else if (prop === 'font-family') valid = /^(inter|georgia|fraunces|courier new|comic sans ms|brush script mt|serif|sans-serif|monospace)(\s*,\s*(inter|georgia|fraunces|courier new|comic sans ms|brush script mt|serif|sans-serif|monospace))*$/i.test(value.replaceAll('"','').replaceAll("'",''));
        else if (prop === 'font-weight') valid = /^(normal|bold|[1-9]00)$/i.test(value);
        else if (prop === 'font-style') valid = /^(normal|italic|oblique)$/i.test(value);
        else if (prop === 'text-decoration') valid = /^(none|underline|line-through|overline)(\s+(underline|line-through|overline))*$/i.test(value);
        else if (prop === 'text-align') valid = /^(left|right|center|justify|start|end)$/i.test(value);
        if (valid) declarations.push(`${prop}: ${value}`);
      }
      if (declarations.length) el.setAttribute('style', declarations.join('; '));
      else el.removeAttribute('style');
    }
    if (el.tagName === 'IMG') {
      const src = el.getAttribute('src') || '';
      if (!/^data:image\/(jpeg|png|gif|webp);base64,[a-z0-9+/=]+$/i.test(src)) {
        el.remove();
      } else {
        el.removeAttribute('width'); el.removeAttribute('height');
        el.setAttribute('loading', 'lazy');
        el.setAttribute('decoding', 'async');
      }
    }
  });
  return box.innerHTML;
}

/* ── helpers ─────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const P = n => String(n).padStart(2, '0');
const K = d => d.getFullYear() + '-' + P(d.getMonth() + 1) + '-' + P(d.getDate());
const todayK = () => K(new Date());
const fmt = k => new Date(k + 'T00:00').toLocaleDateString('default', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

function toast(t) {
  const e = $('#toast');
  e.textContent = t;
  e.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.classList.remove('on'), 2600);
}

/* ── state ───────────────────────────────────────────────── */
let user = null;          // { id, email, username, created_at }
let data = {};            // { 'YYYY-MM-DD': htmlContent }
let view = new Date();
let sel = null;
let dirty = false;
let range = null;
let mode = 'login';
const ed = $('#ed');

/* ── auth UI ─────────────────────────────────────────────── */
$$('.tabs button').forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  $$('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('#sb').textContent = mode === 'login' ? 'Login' : 'Create account';
  $('#un-wrap').hidden = mode === 'login';
  $('#un').required = mode === 'register';
  $('#msg').textContent = '';
  $('#p').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
});

$('#af').onsubmit = async e => {
  e.preventDefault();
  const email = $('#em').value.trim().toLowerCase();
  const password = $('#p').value;
  const username = $('#un').value.trim().toLowerCase();
  const m = t => { $('#msg').textContent = t; };
  const btn = $('#sb');
  btn.disabled = true;

  try {
    if (mode === 'register') {
      if (username.length < 3) return m('Username must be at least 3 characters');
      if (password.length < 6) return m('Password must be at least 6 characters');
      const { data: authData, error } = await sb.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });
      if (error) return m(error.message);
      if (authData.user && !authData.session) {
        m('Check your email to confirm your account, then log in.');
        return;
      }
      // session available (email confirm disabled)
      await enter(authData.session.user);
    } else {
      const { data: authData, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return m(error.message);
      await enter(authData.user);
    }
  } catch (err) {
    m(err.message || 'Something went wrong');
  } finally {
    btn.disabled = false;
  }
};

$('#lo').onclick = async () => {
  await commit();
  await sb.auth.signOut();
  location.reload();
};

/* ── load profile + all entries ──────────────────────────── */
async function loadProfile(uid) {
  const { data: row, error } = await sb
    .from('profiles')
    .select('username, created_at')
    .eq('id', uid)
    .single();
  if (error) throw error;
  return row;
}

async function loadEntries(uid) {
  const { data: rows, error } = await sb
    .from('diary_entries')
    .select('entry_date, content')
    .eq('user_id', uid);
  if (error) throw error;
  const map = {};
  (rows || []).forEach(r => { map[r.entry_date] = sanitizeDiaryHtml(r.content); });
  return map;
}

async function enter(authUser) {
  try {
    const profile = await loadProfile(authUser.id);
    user = {
      id: authUser.id,
      email: authUser.email,
      username: profile.username,
      created_at: profile.created_at
    };
    data = await loadEntries(authUser.id);

    $('#auth').hidden = true;
    $('#app').hidden = false;
    $('#who').textContent = 'Hi, ' + user.username;
    view = new Date();
    sel = null;
    cal();
    alerts();
    pick(todayK());

    const n = missed().length;
    if (n) setTimeout(() => {
      toast(`You missed ${n} day${n > 1 ? 's' : ''} of writing`);
      $('#bell').classList.add('ring');
    }, 700);
  } catch (err) {
    console.error(err);
    toast('Could not load your diary. Please try again.');
    await sb.auth.signOut();
  }
}

/* ── missed days ─────────────────────────────────────────── */
function missed() {
  if (!user) return [];
  const out = [];
  const d = new Date(user.created_at + 'T00:00');
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  for (; d < t; d.setDate(d.getDate() + 1)) {
    const k = K(d);
    if (!data[k]) out.push(k);
  }
  return out;
}

function alerts() {
  const ms = missed();
  $('#bc').textContent = ms.length;
  $('#bc').hidden = !ms.length;
  $('#al').innerHTML = ms.length
    ? ms.slice(-12).reverse().map(k =>
        `<li><span>${fmt(k)}</span><button data-k="${k}">Write</button></li>`
      ).join('') +
      (ms.length > 12 ? `<li class="more">+ ${ms.length - 12} older days</li>` : '')
    : '<li class="ok">No missed days. Keep it up!</li>';
}

$('#al').onclick = e => {
  const b = e.target.closest('[data-k]');
  if (b) {
    const d = new Date(b.dataset.k + 'T00:00');
    view = new Date(d.getFullYear(), d.getMonth(), 1);
    pick(b.dataset.k);
  }
};

$('#bell').onclick = () => {
  const a = $('#alc');
  a.scrollIntoView({ behavior: 'smooth', block: 'center' });
  a.classList.remove('flash');
  void a.offsetWidth;
  a.classList.add('flash');
  $('#bell').classList.remove('ring');
  void $('#bell').offsetWidth;
  $('#bell').classList.add('ring');
};

/* ── calendar ────────────────────────────────────────────── */
function cal() {
  const y = view.getFullYear(), m = view.getMonth();
  const first = new Date(y, m, 1).getDay();
  const n = new Date(y, m + 1, 0).getDate();
  const ms = new Set(missed());
  const t = todayK();
  $('#mt').textContent = view.toLocaleString('default', { month: 'long', year: 'numeric' });
  let h = '<i></i>'.repeat(first);
  for (let d = 1; d <= n; d++) {
    const k = y + '-' + P(m + 1) + '-' + P(d);
    const c = ['day'];
    if (data[k]) c.push('has');
    else if (ms.has(k)) c.push('miss');
    if (k === t) c.push('today');
    if (k === sel) c.push('sel');
    h += `<button class="${c.join(' ')}" data-k="${k}" style="--i:${d}" ${k > t ? 'disabled' : ''} aria-label="${fmt(k)}">${d}</button>`;
  }
  $('#grid').innerHTML = h;
}

$('#grid').onclick = e => {
  const b = e.target.closest('.day');
  if (b) pick(b.dataset.k);
};
$('#pv').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); cal(); };
$('#nx').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); cal(); };
$('#tdy').onclick = () => { view = new Date(); pick(todayK()); };

/* ── entries ─────────────────────────────────────────────── */
function pick(k) {
  commit();
  sel = k;
  ed.innerHTML = sanitizeDiaryHtml(data[k] || '');
  $('#dt').textContent = fmt(k);
  $('#editor').classList.remove('on');
  void $('#editor').offsetWidth;
  $('#editor').classList.add('on');
  $('#empty').hidden = true;
  dirty = false;
  count();
  cal();
}

async function commit() {
  if (sel && dirty) await save(true);
}

async function save(quiet) {
  if (!sel || !user) return;
  const empty = !ed.innerText.trim() && !ed.querySelector('img');
  const content = empty ? '' : sanitizeDiaryHtml(ed.innerHTML);

  try {
    if (empty) {
      // delete row if it exists
      const { error } = await sb
        .from('diary_entries')
        .delete()
        .eq('user_id', user.id)
        .eq('entry_date', sel);
      if (error) throw error;
      delete data[sel];
    } else {
      // upsert
      const { error } = await sb
        .from('diary_entries')
        .upsert(
          { user_id: user.id, entry_date: sel, content },
          { onConflict: 'user_id,entry_date' }
        );
      if (error) throw error;
      data[sel] = content;
    }
    dirty = false;
    cal();
    alerts();
    if (!quiet) toast(empty ? 'Empty entry removed' : 'Entry saved ✓');
  } catch (err) {
    console.error(err);
    toast('Save failed. Please check your connection and try again.');
  }
}

$('#sv').onclick = () => save();
$('#del').onclick = async () => {
  if (!confirm('Delete this entry?')) return;
  ed.innerHTML = '';
  dirty = true;
  await save();
};

function count() {
  $('#wc').textContent = (ed.innerText.trim().split(/\s+/).filter(Boolean).length) + ' words';
}
ed.oninput = () => { dirty = true; count(); };

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && sel) {
    e.preventDefault();
    save();
  }
  if (e.key === 'Escape') $('#pm').hidden = true;
});

/* ── formatting toolbar ──────────────────────────────────── */
document.addEventListener('selectionchange', () => {
  const s = getSelection();
  if (s.rangeCount && ed.contains(s.anchorNode)) range = s.getRangeAt(0).cloneRange();
});
function restore() {
  ed.focus();
  if (range) {
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(range);
  }
}
function run(c, v) {
  restore();
  document.execCommand('styleWithCSS', false, true);
  document.execCommand(c, false, v);
  dirty = true;
  count();
}
$('#tb').addEventListener('mousedown', e => {
  if (e.target.closest('button')) e.preventDefault();
});
$('#tb').addEventListener('click', e => {
  const b = e.target.closest('button[data-c]');
  if (b) run(b.dataset.c);
});
$$('#tb select').forEach(s => s.onchange = () => run(s.dataset.c, s.value));
$$('#tb input[type=color]').forEach(i => i.oninput = () => run(i.dataset.c, i.value));

/* ── pictures ────────────────────────────────────────────── */
function ins(u) {
  restore();
  document.execCommand('insertImage', false, u);
  dirty = true;
  count();
}
$('#ib').onclick = () => $('#img').click();
$('#img').onchange = e => {
  [...e.target.files].forEach(f => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, 900 / im.width);
        const c = document.createElement('canvas');
        c.width = im.width * s;
        c.height = im.height * s;
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        ins(c.toDataURL('image/jpeg', 0.75));
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  });
  e.target.value = '';
};

/* ── pen drawing ─────────────────────────────────────────── */
const cv = $('#cv'), x = cv.getContext('2d');
let drawing = false, er = false;
const clr = () => { x.fillStyle = '#fffdf6'; x.fillRect(0, 0, cv.width, cv.height); };
clr();
const pos = e => {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height];
};
cv.onpointerdown = e => {
  drawing = true;
  cv.setPointerCapture(e.pointerId);
  x.lineCap = x.lineJoin = 'round';
  x.strokeStyle = er ? '#fffdf6' : $('#pc').value;
  x.lineWidth = +$('#ps').value * (er ? 4 : 1);
  x.beginPath();
  x.moveTo(...pos(e));
  x.lineTo(...pos(e));
  x.stroke();
};
cv.onpointermove = e => {
  if (!drawing) return;
  x.lineTo(...pos(e));
  x.stroke();
  x.beginPath();
  x.moveTo(...pos(e));
};
cv.onpointerup = () => drawing = false;
$('#pb').onclick = () => { $('#pm').hidden = false; };
$('#pe').onclick = function () {
  er = !er;
  this.style.background = er ? 'var(--pri)' : '';
  this.style.color = er ? '#fff' : '';
};
$('#pcl').onclick = clr;
$('#pcx').onclick = () => { $('#pm').hidden = true; };
$('#pin').onclick = () => {
  ins(cv.toDataURL('image/jpeg', 0.8));
  clr();
  $('#pm').hidden = true;
};

/* ── boot: restore session ───────────────────────────────── */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    await enter(session.user);
  }
  // listen for auth changes (e.g. token refresh)
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      // already handled by logout reload
    }
  });
})();
</script>
